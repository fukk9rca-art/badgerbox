  runMeta: (LIVE ? 'run · ' + RUN.subject + ' · ' + RUN.level + ' · ' + RUN.modelLabel : 'run #1 · chemistry · hard · complex model') + ' · ' + (N - nFlag) + ' [✓]' + (nFlag ? ' · ' + nFlag + ' [!]' : '') + ' · ' + (LIVE ? RUN.seconds : 34) + 's',
  logChecks: nFlag ? (N - nFlag) + ' match · ' + flagNames + ' not sure' : 'all ' + N + ' match',
  logFile: LIVE ? ((RUN.meta || {}).fileName || 'your assignment') : 'worksheet.jpg',
  logRead: pad('reading ' + (LIVE ? ((RUN.meta || {}).fileName || 'your assignment') : 'worksheet.jpg').slice(0, 18), 'ok'),
  logFound: '  ' + N + ' question' + (N === 1 ? '' : 's') + ' found, doing all ' + N,
  logSubject: pad('finding the subject', LIVE ? String(RUN.subject).slice(0, 22) : 'chemistry'),
  logClass: pad('matching your class', LIVE ? (((RUN.meta || {}).classShort) || 'none given').slice(0, 22) : '10th grade chem'),
  logClassDetail: '  ' + (LIVE ? ((RUN.meta || {}).classDetail || '') : 'mole ratios, 3 sig figs'),
  logLevel: pad('checking how hard it is', LIVE ? RUN.level : 'hard'),
  logModel: pad('picking a model', LIVE ? 'default' : 'complex'),
  logDone: 'done in ' + (LIVE ? RUN.seconds : 34) + 's',
  paperTitle: LIVE ? (RUN.title || RUN.subject || 'worksheet') : 'Stoichiometry worksheet',
  paperClass: LIVE ? ((RUN.meta || {}).classShort || RUN.subject || '') : '10th grade chemistry',
  qHead: 'question ' + (cur + 1) + ' of ' + N + (LIVE ? '' : ''),
  qText: numOf(cur) + '. ' + Q.text,
  qChips: QL.map((q, i) => { const on = i === cur && !sheet; const fl = isFlag(i); return { text: '#' + numOf(i) + (fl ? ' [!]' : ' [✓]'), aria: 'question ' + numOf(i) + (fl ? ', not sure' : ', checked'), pressed: on ? 'true' : 'false', bg: on ? accent : 'transparent', fg: on ? '#000000' : (fl ? '#FFFFFF' : '#BDBDBD'), border: on ? accent : (fl ? '#FFFFFF' : '#5A5A5A'), pick: () => goQ(i) }; }),
  qSummary: nFlag ? (N - nFlag) + ' checked · ' + nFlag + ' to look at' : 'all ' + N + ' checked',
  showWalk: !sheet && !tl,
  showTl: tl,
  tlOpen: tl ? 'true' : 'false',
  tlLabel: tl ? '< back to steps' : 'tl;dr',
  onTl: openTl,
  tlBusy: tl && (s.tlState !== 'ready' || !TL),
  tlReady: tl && s.tlState === 'ready' && !!TL,
  tlBusyText: s.tlState === 'error' ? 'could not build the tl;dr: ' + (s.tlErr || '') + '\npress the tl;dr button twice to try again.' : (LIVE ? 'reading your class ................ ' + classLabel + '\nreading the worksheet ............. ' + N + ' question' + (N === 1 ? '' : 's') + '\nworking out what you\'re learning ...\nwriting the tl;dr ...' : 'reading your class ................ 10th grade chem\nreading the worksheet ............. 6 questions\nworking out what you\'re learning ... stoichiometry\nwriting the tl;dr ...'),
  tlTitle: 'the whole assignment in a nutshell',
  tlTopic: TL ? 'you\'re learning: ' + TL.topic : '',
  tlNutshell: TL ? TL.nutshell : '',
  tlBasis: TL ? (TL.basis || 'worked out from your class and what this assignment asks.') : '',
  onTlWrong: () => { this.setState({ tlAsk: true }); const ta = document.getElementById('bb-ask'); if (ta) ta.focus(); },
  tlSections: (TL ? (TL.sections || []) : []).map((sec, k) => ({ head: sec.head, items: (sec.items || []).concat((!LIVE && k === 2 && nFlag) ? ['#3 on this worksheet is still [!] not sure. fix it before you study from it.'] : []).map((t, i) => ({ n: (i + 1) + '.', text: t, color: /\[!\]/.test(t) ? '#FFFFFF' : '#BDBDBD' })) })),
  tlChips: ['quiz me', 'say it simpler', 'what should i memorize?', 'why does this matter?'].map((c) => ({ text: c, ask: () => ask(c) })),
  notesLabel: 'saved to notes',
  onNotes: () => flash('notes'),
  showGraph: !!G && stepsOn,
  g: Object.assign({}, G || {}, {
    onMove: (e) => {
      if (!G) return;
      const rc = e.currentTarget.getBoundingClientRect();
      if (!rc.width) return;
      const k = BP.nearest(G.marks, (e.clientX - rc.left) / rc.width * BP.VB.w, (e.clientY - rc.top) / rc.height * BP.VB.h);
      const was = (this.state || {}).hov;
      if (k !== (was == null ? null : was)) this.setState({ hov: k });
    },
    onLeave: () => { if ((this.state || {}).hov != null) this.setState({ hov: null }); },
    readOn: !!(FIG && FIG.read && Array.isArray(FIG.points) && FIG.points.length),
    readBorder: readOk ? '#6B6B6B' : '#FFFFFF',
    readHead: readOk ? '[✓] read off the graph' : 'read off the graph',
    readSub: readOk ? 'confirmed by you' : 'does this match your worksheet?',
    rows: (FIG && Array.isArray(FIG.points) ? FIG.points : []).map((q, i) => ({ n: (i + 1) + '.', text: q[0] + (FIG.xUnit ? ' ' + FIG.xUnit : '') + '  →  ' + q[1] + (FIG.yUnit ? ' ' + FIG.yUnit : ''), color: s.edited === i ? '#FFFFFF' : '#BDBDBD', weight: s.edited === i ? '700' : '400' })),
    btns: (readOk ? [] : [{ text: 'looks right', bg: accent, fg: '#000000', pick: () => this.setState({ readOk: Object.assign({}, s.readOk || {}, { [cur]: true }), fixPt: false }) }]).concat([
      { text: 'fix a point', bg: 'transparent', fg: '#FFFFFF', pick: () => { this.setState({ fixPt: true }); const ta = document.getElementById('bb-ask'); if (ta) ta.focus(); } }]),
    readNote: s.fixPt ? 'type the right point in the box below, like (0.30, 0.28), then enter.' : (readOk ? '' : 'if a point is off, the answer is off. badgerbox asks so it never guesses.')
  }),
  showSheet: sheet,
  sheetOpen: sheet ? 'true' : 'false',
  walkFor: '#' + numOf(cur),
  views: VIEWS.map((v, i) => { const on = vs.indexOf(i) !== -1; return { text: (on ? '[x] ' : '[ ] ') + v, pressed: on ? 'true' : 'false', bg: 'transparent', fg: on ? '#FFFFFF' : '#8C8C8C', border: on ? '#FFFFFF' : '#5A5A5A', pick: () => toggleView(i) }; }),
  viewNote: (hasE ? 'click a step to see why' : hasW ? 'the work, the way you would write it out' : 'just the final answer') + (stepsOn && !hasA ? ' · answer hidden' : ''),
  showSteps: stepsOn,
  showAnswer: hasA,
  ansBg: flagNow ? '#000000' : accent,
  ansFg: flagNow ? '#FFFFFF' : '#000000',
  ansText: (flagNow && !LIVE) ? '65.9 g of CO₂ if the mass is 22.0 g · 95.8 g if it is 32.0 g' : Q.ans,
  ansTag: flagNow ? '[!] not sure' : ((LIVE ? okd[cur] : cur === 2) ? '[✓] confirmed by you' : '[✓] checked 2 ways'),
  showCheck: hasA && !flagNow,
  checkText: Q.check,
  showFlag: flagNow,
  flagText: LIVE ? (s.retry === 'busy' ? 'working it out again...' : String(Q.flag || 'the two ways gave different answers.')) : s.retry === 'busy' ? 'reading the photo again...' : (s.retry === 'done' ? 'read it again and still can\'t tell. the mass in the photo could be 22.0 g or 32.0 g, so the two passes split at step 2. pick the right one or type the question out.' : 'the photo is blurry here. one pass read the mass as 22.0 g, the other as 32.0 g, so they disagree from step 2 on. both answers are shown above.'),
  flagBtns: LIVE ? [
    { text: 'type the question out', bg: accent, fg: '#000000', pick: typeOut },
    { text: s.retry === 'busy' ? 'working...' : 'try again', bg: 'transparent', fg: '#FFFFFF', pick: retry },
    { text: 'it\'s right', bg: 'transparent', fg: '#FFFFFF', pick: () => { this.setState({ okd: Object.assign({}, okd, { [cur]: true }) }); say([{ who: 'bb', text: '#' + numOf(cur) + ' marked as right by you.' }]); } }
  ] : [
    { text: 'it says 22.0 g', bg: accent, fg: '#000000', pick: () => pickFixSample('22') },
    { text: 'it says 32.0 g', bg: accent, fg: '#000000', pick: () => pickFixSample('32') },
    { text: 'type the question out', bg: 'transparent', fg: '#FFFFFF', pick: typeOut },
    { text: s.retry === 'busy' ? 'reading...' : 'try again', bg: 'transparent', fg: '#FFFFFF', pick: retry }
  ],
  flagNote: s.typing ? 'type question ' + numOf(cur) + ' in the box below and press enter.' : 'badgerbox does not guess. this one stays marked on the completed worksheet until you fix it.',
  askHint: tl ? (s.tlAsk ? 'what are you learning right now? a few words is fine' : 'ask anything about the material') : (s.fixPt && FIG) ? 'type the point, e.g. (0.30, 0.28)' : (s.typing && flagNow) ? 'type question ' + numOf(cur) + ' here, then enter' : 'ask anything about #' + numOf(cur),
  thread: thread.map((m) => ({ text: (m.who === 'you' ? '> ' : '') + m.text, color: m.who === 'you' ? '#FFFFFF' : '#BDBDBD', border: m.who === 'you' ? '#5A5A5A' : '#FFFFFF' })),
  chips: ['explain it simpler', 'why step ' + stepAsk + '?', 'another example', 'check my answer'].map((c) => ({ text: c, ask: () => ask(c) })),
  copyAllLabel: s.copiedAll ? 'copied' : 'copy answers',
  onCopyAll: () => { const all = QL.map((q, i) => numOf(i) + '. ' + ((isFlag(i) && !LIVE) ? '65.9 g or 95.8 g' : q.ans) + (isFlag(i) ? '  (not sure)' : '')).join('\n'); try { navigator.clipboard && navigator.clipboard.writeText(all); } catch (err) {} flash('copiedAll', 2500); },
  copyLabel: s.copied ? 'copied' : (!stepsOn ? 'copy answer' : 'copy steps'),
  sheetLabel: sheet ? '< back to steps' : '⤓ completed worksheet',
  showFilled: sheet && filledOn,
  showClean: sheet && !filledOn,
  sheetModes: canFill ? [
    { text: 'on your worksheet', on: filledOn, pick: () => this.setState({ sheetMode: 'filled' }) },
    { text: 'clean copy', on: !filledOn, pick: () => this.setState({ sheetMode: 'clean' }) }
  ].concat(filledOn ? [{ text: 'A-', on: false, pick: () => this.setState({ fillScale: Math.max(0.6, fillScale - 0.1) }) }, { text: 'A+', on: false, pick: () => this.setState({ fillScale: Math.min(2, fillScale + 0.1) }) }] : [])
    .map((m) => ({ text: m.text, pressed: m.on ? 'true' : 'false', bg: m.on ? accent : 'transparent', fg: m.on ? '#000000' : '#BDBDBD', border: m.on ? accent : '#5A5A5A', pick: m.pick })) : [],
  fillPages: filledOn ? FILES.map((f, pi) => ({ url: f.url, alt: 'your worksheet, page ' + (pi + 1) + ', with the answers written in',
    items: fillItems(pi).map((x) => ({ text: ansLine(x.q, x.i), left: (Number(x.pl.x) * 100).toFixed(2) + '%', top: (Number(x.pl.y) * 100).toFixed(2) + '%',
      width: (Math.max(0.15, Math.min(1 - Number(x.pl.x), Number(x.pl.w) || 0.5)) * 100).toFixed(1) + '%', size: (2.1 * fillScale).toFixed(2) + 'cqw',
      down: startDrag(x.i, x.pl), move: moveDrag, up: endDrag })) })) : [],
  sheetNote: filledOn ? 'your own worksheet with the answers written where they go. drag an answer if it landed in the wrong spot. A- and A+ change the size.' + (nFlag ? ' (?) marks the ones it wasn\'t sure about.' : '') : (LIVE && !canFill && sheet ? 'this is the clean copy. answers can only be put on your own worksheet when you give it as a screenshot or photo. ' : '') + 'a clean copy in the worksheet\'s own order and numbering, with the work shown.' + (nFlag ? ' ' + flagNames + (nFlag === 1 ? ' stays' : ' stay') + ' marked until you fix ' + (nFlag === 1 ? 'it.' : 'them.') : ' every answer is checked.'),
  paper: QL.map((q, i) => ({
    head: numOf(i) + '. ' + q.text,
    work: q.steps.map((d) => ({ line: d.text + ':  ' + d.result })),
    ans: (isFlag(i) && !LIVE) ? '65.9 g or 95.8 g' : q.ans,
    mark: isFlag(i) ? (LIVE ? '[!] not sure' : '[!] not sure · mass in the photo is unclear') : ''
  })),
  statusMain: (s.dl && filledOn) ? '[worksheet] saved to your downloads as completed-worksheet.png' : s.copiedAll ? '[copied] all ' + N + ' answers are on your clipboard' : s.notes ? '[notes] ' + (API ? API.notes(classLabel).length : 0) + ' tl;dr' + ((API ? API.notes(classLabel).length : 0) === 1 ? '' : 's') + ' saved for ' + classLabel + '. the study guide view is coming.' : (tl && s.tlState === 'busy') ? '[tl;dr] working out what you\'re learning' : s.dl ? '[worksheet] the clean completed copy would download here when badgerbox is live' : s.print ? '[print] allow pop-ups for this site, then press print again' : s.copied ? '[copied] #' + (cur + 1) + ' is on your clipboard' : s.pdf ? '[pdf] would save here when badgerbox is live' : s.retry === 'busy' ? '[checking] working ' + '#' + numOf(cur) + ' out again' : (nFlag ? '[done] ' + (N - nFlag) + ' checked · ' + flagNames + (nFlag === 1 ? ' needs' : ' need') + ' a look' : '[done] all ' + N + ' checked'),
  statusNote: (s.copied || s.pdf || s.dl || s.print) ? '' : (tl ? 'the whole assignment in a nutshell' : sheet ? 'preview of the completed worksheet' : 'question ' + (cur + 1) + ' of ' + N + ' · read the steps before you copy anything'),
  onCopy: () => { try { navigator.clipboard && navigator.clipboard.writeText(!stepsOn ? Q.ans : stepsText); } catch (err) {} flash('copied', 2500); },
  onPdf: () => (filledOn ? printFilled() : printSheet()),
  onDownload: () => (filledOn ? downloadFilled() : printSheet()),
  onPrint: () => (filledOn ? printFilled() : printSheet()),
  onSheet: () => this.setState({ sheet: !sheet, tl: false }),
  onAskType: (e) => { this.setState({ asked: e.target.value, askPos: e.target.selectionStart }); syncM('bb-ask-mirror', e.target); },
  onCaret: (e) => { const p = e.target.selectionStart; if (p !== (this.state || {}).askPos) this.setState({ askPos: p }); syncM('bb-ask-mirror', e.target); },
  onTaScroll: (e) => syncM('bb-ask-mirror', e.target),
  caretBefore: asked.slice(0, s.askPos != null ? s.askPos : undefined),
  onAskKey: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (asked.trim()) { ask(asked); e.target.value = ''; } } },
  onRootOut: () => setTimeout(() => { const a = document.activeElement; if (!a || a === document.body || a.id === 'bb-root') this.focusBox(); }, 0),
  onRefocus: () => { if (!this.drag && !this.dragV && !this.dragA) this.focusBox(); },
  onPageKey: (e) => {
    const tag = (e.target && e.target.tagName) || '';
    if (e.key === 'Escape') { e.preventDefault(); if (sheet || tl) { this.setState({ sheet: false, tl: false, tlAsk: false }); return; } back(); return; }
    const typing = tag === 'TEXTAREA' || tag === 'INPUT';
    const empty = !typing || !String(e.target.value || '').length;
    if (empty && !e.altKey && !e.ctrlKey && !e.metaKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); goQ(cur + (e.key === 'ArrowRight' ? 1 : -1)); return; }
    if (e.altKey && !e.ctrlKey && !e.metaKey) {
      if (e.code === 'KeyW') { e.preventDefault(); this.setState({ sheet: !sheet, tl: false }); return; }
      if (e.code === 'KeyT') { e.preventDefault(); openTl(); return; }
      if (e.code === 'KeyN') { e.preventDefault(); back(); return; }
      if (e.code === 'KeyV') { e.preventDefault(); this.setState({ views: PRESETS[(presetIdx + 1) % PRESETS.length] }); return; }
      const d = /^Digit([1-5])$/.exec(e.code || '');
      if (d) { e.preventDefault(); const i = Number(d[1]) - 1; if (i < Q.steps.length) this.setState({ open: open === i ? -1 : i }); return; }
    }
    if (typing) return;
    if (e.key.length === 1 && e.key !== ' ' && !e.ctrlKey && !e.metaKey && !e.altKey) { const ta = document.getElementById('bb-ask'); if (ta) ta.focus(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goQ(cur + 1); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goQ(cur - 1); return; }
    if (e.key === 'w' || e.key === 'W') { e.preventDefault(); this.setState({ sheet: !sheet }); return; }
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); back(); return; }
    if (e.key === 'v' || e.key === 'V') { e.preventDefault(); this.setState({ views: PRESETS[(presetIdx + 1) % PRESETS.length] }); return; }
    if (e.key >= '1' && e.key <= '5') { e.preventDefault(); const i = Number(e.key) - 1; if (i < Q.steps.length) this.setState({ open: open === i ? -1 : i }); return; }
    if (e.key === 'Enter' && tag !== 'BUTTON' && tag !== 'A') { e.preventDefault(); const ta = document.getElementById('bb-ask'); if (ta) ta.focus(); }
  },
  steps: Q.steps.map((d, i) => {
    const fl = flagNow && !!d.flag;
    return {
      label: 'step ' + (i + 1), text: d.text, result: (fl ? '[!] ' : '') + d.result, why: d.why,
      lbg: fl ? accent : 'transparent', lfg: fl ? '#000000' : '#BDBDBD',
      isOpen: hasE && open === i,
      open: hasE && open === i ? 'true' : 'false',
      toggle: () => { if (hasE) this.setState({ open: open === i ? -1 : i }); },
      askLabel: 'ask about step ' + (i + 1),
      ask: () => ask('why step ' + (i + 1) + '?')
    };
  })
};
}
}
</script>
